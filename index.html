<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recueil">
<title>Mon recueil de mathématiques</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap"><main id="view" aria-live="polite"></main></div>

<nav class="tabbar glass" id="tabbar" aria-label="Navigation">
  <button data-v="conseiller"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.2 5.6.7-4.1 3.9 1 5.6L12 15.6 7.1 18.4l1-5.6L4 8.9l5.6-.7z"/></svg>Conseiller</button>
  <button data-v="biblio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9l2 2h7.5A1.5 1.5 0 0 1 20 7.5v10a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/></svg>Tous les DS</button>
  <button data-v="cours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Cours</button>
  <button data-v="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Plus</button>
</nav>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Document">
  <div class="vh"><button class="btn sm" id="vclose">Fermer</button><span class="vt" id="vttl"></span><button class="btn sm" id="vminus" aria-label="Dézoomer">−</button><button class="btn sm" id="vplus" aria-label="Zoomer">+</button></div>
  <div class="vsw" id="vsw" hidden><button data-w="sujet" aria-pressed="true">Sujet</button><button data-w="cor" aria-pressed="false">Corrigé</button></div>
  <div class="vb" id="vbody"></div>
</div>

<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
